name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Optional: sign releases with your own key (Settings → Secrets → Actions):
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Restore signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KS != ''
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      # Runs the real app against a fake site on the JVM (Robolectric) and takes screenshots
      - name: App flow test + screenshots
        id: uitest
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Publish screenshots + test results
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/screens
          cp -r app/build/screens/* /tmp/screens/ 2>/dev/null || true
          mkdir -p /tmp/screens/results
          cp app/build/test-results/testDebugUnitTest/*.xml /tmp/screens/results/ 2>/dev/null || true
          if [ -f test.log ]; then tail -n 400 test.log > /tmp/screens/test-log.txt; fi
          echo "${{ steps.uitest.outcome }}" > /tmp/screens/OUTCOME.txt
          cd /tmp/screens
          git init -q -b screens
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Screens ${GITHUB_SHA::7}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AB-Gsm-Rental.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/AB-Gsm-Rental-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AB-Gsm-Rental-apk
          path: out/*.apk

      # Latest APKs on the "apk" branch as well (easy direct download link)
      - name: Publish APK branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b apk
          git add *.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci-log
          if [ -f build.log ]; then cp build.log /tmp/ci-log/build.log; else echo "no build log" > /tmp/ci-log/build.log; fi
          grep -nE "^e: |error:|FAILURE|What went wrong" build.log > /tmp/ci-log/errors.txt 2>/dev/null || true
          cd /tmp/ci-log
          git init -q -b ci-log
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Build log ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log

      - name: Attach to GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
